    area.querySelectorAll('[data-fig-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.figRemove.split('|');
        state.values[fid].splice(+idx, 1);
        renderForm();
        renderPreview();
      });
    });

    // ---------- PLAYERS field handlers ----------
    area.querySelectorAll('[data-ply]').forEach(sel => {
      sel.addEventListener('change', e => {
        const [fid, idx, key] = e.target.dataset.ply.split('|');
        if (key === 'color') {
          state.values[fid][+idx].color = e.target.value;
          renderForm();
          renderPreview();
        }
      });
    });
    area.querySelectorAll('[data-ply-num]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, key] = e.target.dataset.plyNum.split('|');
        const n = parseFloat(e.target.value);
        state.values[fid][+idx][key] = isNaN(n) ? 0 : n;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-text]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, key] = e.target.dataset.plyText.split('|');
        state.values[fid][+idx][key] = e.target.value;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-pt]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, j, axis] = e.target.dataset.plyPt.split('|');
        const n = parseFloat(e.target.value);
        state.values[fid][+idx].route[+j][+axis] = isNaN(n) ? 0 : n;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-pt-add]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.plyPtAdd.split('|');
        const p = state.values[fid][+idx];
        const last = (p.route && p.route.length) ? p.route[p.route.length - 1] : [p.x, p.y];
        p.route = p.route || [];
        p.route.push([Math.min(60, (last[0] || 15) + 4), last[1] || 12.5]);
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-pt-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx, j] = e.currentTarget.dataset.plyPtRemove.split('|');
        state.values[fid][+idx].route.splice(+j, 1);
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-add]').forEach(btn => {
      btn.addEventListener('click', e => {
        const fid = e.currentTarget.dataset.plyAdd;
        state.values[fid].push(newPlayer());
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.plyRemove.split('|');
        state.values[fid].splice(+idx, 1);
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-origin]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, axis] = e.target.dataset.origin.split('|');
        const n = parseFloat(e.target.value);
        if (!state.values[fid] || typeof state.values[fid] !== 'object') state.values[fid] = { x:15, y:12.5 };
        state.values[fid][axis] = isNaN(n) ? 0 : n;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-scale]').forEach(inp => {
      inp.addEventListener('input', e => {
        const fid = e.target.dataset.scale;
        state.values[fid] = parseFloat(e.target.value) || 1;
        renderPreview();
      });
    });
  }

  // ----------------------------------------------------------------
  // Render preview
  // ----------------------------------------------------------------
  function renderPreview() {
    const t = T[state.tpl];
    const wrap = document.getElementById('preview-wrap');
    applyAspect(state.aspect);
    fitPreview();
    const ezToggle = document.getElementById('top-ez-toggle');
    const ezInput = document.getElementById('top-ez-input');
    if (ezToggle) ezToggle.style.display = (state.aspect === 'story') ? 'none' : 'flex';
    if (ezInput) ezInput.checked = !!state.topEndZone;
    snapshotSlide();
    renderSlideBar();
    const accCls = state.accent !== 'primary' ? `acc-${state.accent}` : '';
    const wmRight = state.values.wm_right || '';
    const chromeHtml = state.chrome === 'none' ? '' : window.tileChrome(state.chrome);

    wrap.innerHTML = `<div class="tile ${t.cls} ${accCls}">
      ${chromeHtml}
      ${t.render(state.values)}
      <div class="wordmark"><span class="left">TROMSØ FLAGGFOTBALL</span><span class="right">${wmRight}</span></div>
    </div>`;

    // Apply uploaded photo, if any.
    if (state.photo) {
      const photoEl = wrap.querySelector('[data-photo]');
      if (photoEl) {
        photoEl.style.backgroundImage = `url(${state.photo})`;
        photoEl.classList.remove('ph');
        if (state.photoCutout) {
          photoEl.classList.add('cutout');
        } else {
          photoEl.classList.remove('cutout');
        }
      }
    }

    // Shrink-to-fit player name lines. Done after layout so we can measure
    // each line's scrollWidth against its container's clientWidth, scale
    // font-size by the worst-case ratio, and floor at 28px so it never
    // goes invisible. Runs once per render — fast, no observer needed.
    wrap.querySelectorAll('.player-name').forEach(el => {
      const parent = el.parentElement;
      if (!parent) return;
      // clientWidth includes padding — subtract it to get the real content box.
      const cs = getComputedStyle(parent);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      const maxW = parent.clientWidth - padL - padR;
      if (maxW <= 0) return;
      // Force lines to not wrap so scrollWidth reflects raw line length.
      el.style.whiteSpace = 'nowrap';
      // Wrap each <br>-separated line so we can measure individually.
      const lines = el.innerHTML.split(/<br\s*\/?>/i);
      el.innerHTML = lines.map(t => `<span class="pn-line" style="display:block;">${t}</span>`).join('');
      let size = 84;
      el.style.fontSize = size + 'px';
      const lineEls = el.querySelectorAll('.pn-line');
      // Iteratively reduce until every line fits.
      for (let i = 0; i < 30; i++) {
        let widest = 0;
        lineEls.forEach(l => { if (l.scrollWidth > widest) widest = l.scrollWidth; });
        if (widest <= maxW || size <= 28) break;
        size = Math.max(28, Math.floor(size * (maxW / widest) * 0.98));
        el.style.fontSize = size + 'px';
      }
    });
    // Shrink-to-fit position abbr (same approach as player name).
    wrap.querySelectorAll('.pos-abbr').forEach(el => {
      const parent = el.parentElement;
      if (!parent) return;
      const cs = getComputedStyle(parent);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      const maxW = parent.clientWidth - padL - padR;
      if (maxW <= 0) return;
      el.style.whiteSpace = 'nowrap';
      let size = 360;
      el.style.fontSize = size + 'px';
      for (let i = 0; i < 30; i++) {
        const w = el.scrollWidth;
        if (w <= maxW || size <= 80) break;
        size = Math.max(80, Math.floor(size * (maxW / w) * 0.98));
        el.style.fontSize = size + 'px';
      }
    });

    // Matchup names: shrink-to-fit so both sides use the same font size.
    // Measure each name's scrollWidth against its container, compute the
    // required size for every line, then apply the smallest size to ALL
    // names so both halves stay visually balanced.
    const matchupNames = wrap.querySelectorAll('.matchup-name');
    if (matchupNames.length) {
      const startSize = 68;
      const minSize = 32;
      let sharedSize = startSize;
      matchupNames.forEach(el => {
        const parent = el.parentElement;
        if (!parent) return;
        const cs = getComputedStyle(parent);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const maxW = parent.clientWidth - padL - padR;
        if (maxW <= 0) return;
        el.style.whiteSpace = 'nowrap';
        const lines = el.innerHTML.split(/<br\s*\/?>/i);
        el.innerHTML = lines.map(t => `<span class="mn-line" style="display:block;">${t}</span>`).join('');
        let size = startSize;
        el.style.fontSize = size + 'px';
        const lineEls = el.querySelectorAll('.mn-line');
        for (let i = 1; i <= 30; i++) {
          let widest = 0;
          lineEls.forEach(l => { if (l.scrollWidth > widest) widest = l.scrollWidth; });
          if (widest <= maxW || size <= minSize) break;
          size = Math.max(minSize, Math.floor(size * (maxW / widest) * 0.98));
          el.style.fontSize = size + 'px';
        }
        if (size < sharedSize) sharedSize = size;
      });
      matchupNames.forEach(el => { el.style.fontSize = sharedSize + 'px'; });
    }
  }
  document.querySelectorAll('#picker button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#picker button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.tpl = b.dataset.tpl;
      loadDefaults(state.tpl);
      renderForm();
      renderPreview();
    });
  });

  document.querySelectorAll('.chrome-row button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.chrome-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.chrome = b.dataset.chrome;
      renderPreview();
    });
  });

  document.querySelectorAll('#accent-row button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#accent-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.accent = b.dataset.acc;
      renderPreview();
    });
  });

  document.querySelectorAll('#aspect-row button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#aspect-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.aspect = b.dataset.aspect;
      renderPreview();
    });
  });

  document.getElementById('top-ez-input').addEventListener('change', e => {
    state.topEndZone = e.target.checked;
    renderPreview();
  });

  // ---------- SLIDE BAR ----------
  function renderSlideBar() {
    const bar = document.getElementById('slide-bar');
    if (!bar) return;
    const tabs = state.slides.map((s, i) => {
      const isActive = i === state.currentSlide;
      const label = (T[s.tpl]?.label || s.tpl).split(' ')[0];
      return `<button data-slide="${i}" class="${isActive ? 'active' : ''}" title="${T[s.tpl]?.label || ''}">Slide ${i+1} · ${label}</button>`;
    }).join('');
    const removeBtn = state.slides.length > 1
      ? `<button class="remove" data-slide-remove="${state.currentSlide}" title="Remove current slide">× Slide ${state.currentSlide+1}</button>`
      : '';
    bar.innerHTML = tabs + `<button class="add" data-slide-add="1">＋ Add slide</button>` + removeBtn;
    bar.querySelectorAll('[data-slide]').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = +e.currentTarget.dataset.slide;
        if (idx === state.currentSlide) return;
        snapshotSlide();
        loadSlide(idx);
        renderForm();
        renderPreview();
      });
    });
    bar.querySelector('[data-slide-add]')?.addEventListener('click', () => {
      snapshotSlide();
      state.slides.push(blankSlide(state.tpl));
      loadSlide(state.slides.length - 1);
      renderForm();
      renderPreview();
    });
    bar.querySelector('[data-slide-remove]')?.addEventListener('click', () => {
      if (state.slides.length <= 1) return;
      if (!confirm(`Remove slide ${state.currentSlide+1}? This can't be undone.`)) return;
      state.slides.splice(state.currentSlide, 1);
      const next = Math.max(0, state.currentSlide - 1);
      loadSlide(next);
      renderForm();
      renderPreview();
    });
  }

  document.getElementById('photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const removeBg = document.getElementById('bg-remove-toggle').checked;
    const label = document.getElementById('upload-label');

    const setPhoto = (dataUrl, cutout) => {
      state.photo = dataUrl;
      state.photoCutout = cutout;
      document.getElementById('upload').classList.add('has-image');
      label.textContent = cutout ? '✓ Background removed' : '✓ Image loaded';
      renderPreview();
    };

    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      if (!removeBg) {
        setPhoto(dataUrl, false);
        return;
      }
      label.textContent = '… Loading model (first run ~70MB)';
      try {
        const { removeBackground } = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm');
        label.textContent = '… Removing background';
        const blob = await removeBackground(dataUrl, {
          progress: (key, cur, tot) => {
            const pct = tot ? Math.round((cur / tot) * 100) : 0;
            label.textContent = `… ${key} ${pct}%`;
          },
        });
        const reader2 = new FileReader();
        reader2.onload = (e2) => setPhoto(e2.target.result, true);
        reader2.readAsDataURL(blob);
      } catch (err) {
        console.error('bg removal failed', err);
        label.textContent = '✓ Image loaded (bg removal failed)';
        setPhoto(dataUrl, false);
      }
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    loadDefaults(state.tpl);
    state.photo = null;
    state.photoCutout = false;
    document.getElementById('upload').classList.remove('has-image');
    document.getElementById('upload-label').textContent = 'Drop or click to upload';
    document.getElementById('photo-input').value = '';
    document.getElementById('bg-remove-toggle').checked = false;
    renderForm();
    renderPreview();
  });

  async function loadHtmlToImage() {
    if (window.htmlToImage) return window.htmlToImage;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load html-to-image'));
      document.head.appendChild(s);
    });
    return window.htmlToImage;
  }

  async function fetchAsDataUrl(url, mime) {
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('Fetch failed: ' + url);
    const buf = await res.arrayBuffer();
    let bin = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    return `data:${mime};base64,` + btoa(bin);
  }

  let _embeddedFontCSS = null;
  async function buildEmbeddedFontCSS() {
    if (_embeddedFontCSS !== null) return _embeddedFontCSS;
    try {
      const [syne, outfit] = await Promise.all([
        fetchAsDataUrl(new URL('fonts/Syne-VariableFont_wght.ttf', location.href).href, 'font/ttf'),
        fetchAsDataUrl(new URL('fonts/Outfit-VariableFont_wght.ttf', location.href).href, 'font/ttf'),
      ]);
      _embeddedFontCSS = `
        @font-face { font-family: 'Syne'; src: url(${syne}) format('truetype-variations'); font-weight: 400 800; font-style: normal; }
        @font-face { font-family: 'Outfit'; src: url(${outfit}) format('truetype-variations'); font-weight: 100 900; font-style: normal; }
      `;
    } catch (e) {
      console.warn('Font embed failed', e);
      _embeddedFontCSS = '';
    }
    return _embeddedFontCSS;
  }

  async function saveOrShareImage(blob, filename) {
    // Detect touch-only / mobile devices — on those we prefer the native share
    // sheet ("Save to Photos" on iOS, "Save to gallery" on Android). On desktop
    // we want the OS save-file dialog instead of a share sheet.
    const isMobile = (() => {
      try {
        const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        const noHover = window.matchMedia && window.matchMedia('(hover: none)').matches;
        const ua = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
        return ua || (coarse && noHover);
      } catch { return false; }
    })();
    const file = new File([blob], filename, { type: 'image/png' });
    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        console.warn('Share failed, falling back to download', err);
      }
    }
    // Desktop path: use the File System Access API for a true native "Save As"
    // dialog when available (Chromium-based browsers). Falls back to an
    // anonymous <a download> click otherwise (which still hits the OS dialog
    // when the user has "Ask where to save each file" enabled in their browser).
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'PNG image', accept: { 'image/png': ['.png'] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        console.warn('Save picker failed, falling back to download', err);
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    // Don't open a new tab — that's what triggered the share-sheet on some
    // desktop browsers. A plain download click hits the OS dialog.
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Slugify a string for filename use. Keeps letters/digits, swaps anything
  // else for "-", and trims duplicates/edges.
  function slugify(s, maxLen = 28) {
    return String(s || '')
      // strip HTML tags first so titles like "<span>X</span>" become "X"
      .replace(/<[^>]*>/g, ' ')
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[æÆ]/g, 'ae').replace(/[øØ]/g, 'o').replace(/[åÅ]/g, 'a')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, maxLen) || 'post';
  }

  function slideFilename(slide, idx) {
    const tpl = (slide.tpl || 'post').replace(/[^a-z0-9-_]+/gi, '-').toLowerCase();
    // Pick the most representative text field for the title slug.
    const v = slide.values || {};
    const title = v.titleA || v.first || v.name || v.abbr || v.big || v.eyebrow ||
      v.oFirst || v.oLast || (T[slide.tpl]?.label) || tpl;
    return `tff-${String(idx + 1).padStart(2, '0')}-${tpl}-${slugify(title)}.png`;
  }

  async function exportCurrentTile() {
    const tile = document.querySelector('#preview-wrap .tile');
    if (!tile) throw new Error('Nothing to export yet.');
    const dims = ASPECT_DIMS[state.aspect] || ASPECT_DIMS.square;
    const prevTransform = tile.style.transform;
    try {
      const htmlToImage = await loadHtmlToImage();
      tile.style.transform = 'none';
      try {
        if (document.fonts) {
          await Promise.all([
            document.fonts.load('700 48px "Syne"'),
            document.fonts.load('800 72px "Syne"'),
            document.fonts.load('400 16px "Outfit"'),
            document.fonts.load('500 18px "Outfit"'),
            document.fonts.load('700 18px "Outfit"'),
          ]);
          await document.fonts.ready;
        }
      } catch (_) {}
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const fontEmbedCSS = await buildEmbeddedFontCSS();
      const dataUrl = await htmlToImage.toPng(tile, {
        width: dims.w,
        height: dims.h,
        pixelRatio: 1,
        cacheBust: true,
        skipFonts: false,
        fontEmbedCSS,
      });
      return await (await fetch(dataUrl)).blob();
    } finally {
      tile.style.transform = prevTransform;
    }
  }

  document.getElementById('export-btn').addEventListener('click', async () => {
    const btn = document.getElementById('export-btn');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    // Walk slides starting from the current one. After each save we ask the
    // user whether to continue to the next slide.
    try {
      snapshotSlide();
      const total = state.slides.length;
      for (let i = state.currentSlide; i < total; i++) {
        if (i !== state.currentSlide) {
          // Switch to the next slide so its tile is in the DOM.
          loadSlide(i);
          renderForm();
          renderPreview();
          // Give the browser two frames to commit layout before snapshotting.
          await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        }
        btn.textContent = `Exporting ${i+1}/${total}…`;
        const blob = await exportCurrentTile();
        const filename = slideFilename(state.slides[i], i);
        await saveOrShareImage(blob, filename);
        if (i < total - 1) {
          const go = confirm(`Saved slide ${i+1}/${total} as "${filename}".\n\nContinue to slide ${i+2}?`);
          if (!go) break;
        } else if (total > 1) {
          alert(`Saved slide ${i+1}/${total} as "${filename}".\nAll slides exported.`);
        }
      }
    } catch (err) {
      console.error(err);
      alert('Export failed: ' + (err && err.message ? err.message : err));
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  function fitPreview() {
    const area = document.querySelector('.preview-area');
    const wrap = document.getElementById('preview-wrap');
    if (!area || !wrap) return;
    const dims = ASPECT_DIMS[state.aspect] || ASPECT_DIMS.square;
    const tileW = dims.w, tileH = dims.h;
    const cs = getComputedStyle(area);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    // Reserve ~64px under the preview for the slide-bar.
    const availW = Math.max(160, area.clientWidth - padX);
    const availH = Math.max(200, window.innerHeight - padY - 80);
    const scale = Math.min(availW / tileW, availH / tileH, 0.55);
    wrap.style.setProperty('--prev-scale', String(scale));
    wrap.style.setProperty('--prev-w', (tileW * scale) + 'px');
    wrap.style.setProperty('--prev-h', (tileH * scale) + 'px');
  }
  window.addEventListener('resize', fitPreview);
  renderForm();
  fitPreview();
  renderPreview();
</script>
</body>
</html>

#preview-wrap .left-col >.jersey { margin: 0px !important }
