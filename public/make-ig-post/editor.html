<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tromsø Flaggfotball — IG Frame Editor</title>
<link rel="stylesheet" href="frames.css">
<script src="chrome.js"></script>
<style>
  html, body { overflow-x: hidden; }
  body { display: grid; grid-template-columns: 420px minmax(0, 1fr); min-height: 100vh; max-width: 100vw; }
  .sidebar { background: #08141a; border-right: 1px solid rgba(13,106,106,0.4);
    padding: 32px 24px; overflow-y: auto; max-height: 100vh; min-width: 0; }
  .sidebar h1 { font-family: var(--font-heading); font-weight: 800; font-size: 28px;
    margin: 0 0 4px 0; color: var(--fg); letter-spacing: -0.01em; }
  .sidebar .lead { font-size: 13px; color: var(--fg-muted); margin: 0 0 24px 0; line-height:1.5; }
  .sidebar h3 { font-family: var(--font-heading); font-size: 12px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--fg-muted); margin: 24px 0 12px 0; font-weight: 700; }
  .picker { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom: 16px; }
  .picker button { padding:12px 8px; background:transparent; color:var(--fg-muted);
    border:1px solid rgba(13,106,106,0.5); border-radius:8px; cursor:pointer;
    font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; line-height:1.2; }
  .picker button:hover { color:var(--fg); border-color:var(--primary); }
  .picker button.active { background:var(--primary); color:var(--natt-500); border-color:var(--primary); }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-family:var(--font-body); font-size:11px;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-muted); margin-bottom:6px; font-weight:600; }
  .field input, .field textarea, .field select { width:100%; padding:10px 12px;
    background:#021018; border:1px solid rgba(13,106,106,0.5); border-radius:6px;
    color:var(--fg); font-family:var(--font-body); font-size:14px; box-sizing:border-box; }
  .field textarea { resize:vertical; min-height: 60px; font-family: var(--font-body); }
  .field input:focus, .field textarea:focus, .field select:focus { outline:none; border-color:var(--primary); }
  .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .upload { padding:20px; border:2px dashed rgba(13,106,106,0.6); border-radius:8px;
    text-align:center; cursor:pointer; transition:all 0.2s; }
  .upload:hover { border-color:var(--primary); background:rgba(84,197,158,0.05); }
  .upload input { display:none; }
  .upload-label { font-family:var(--font-heading); font-weight:700; font-size:13px;
    color:var(--primary); letter-spacing:0.08em; text-transform:uppercase; }
  .upload-hint { font-size:12px; color:var(--fg-muted); margin-top:6px; }
  .upload.has-image { border-style:solid; border-color:var(--primary); background:rgba(84,197,158,0.08); }
  .actions { display:flex; gap:8px; margin-top: 24px; padding-top:20px; border-top:1px solid rgba(13,106,106,0.4); flex-wrap:wrap; }
  .actions button { flex:1; min-width: 140px; padding:12px; background:var(--primary); color:var(--natt-500);
    border:none; border-radius:8px; cursor:pointer; font-family:var(--font-heading); font-weight:800;
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase; }
  .actions button.secondary { background:transparent; color:var(--fg-muted); border:1px solid rgba(13,106,106,0.6); }
  .actions button:hover { opacity:0.9; }
  .preview-area { padding: 32px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:18px;
    background:radial-gradient(at center, #08141a 0%, #02080c 100%); min-width: 0; overflow: hidden; }
  .preview-wrap { width: var(--prev-w, 540px); height: var(--prev-h, 540px); }
  .preview-wrap .tile { transform: scale(var(--prev-scale, 0.5)); transform-origin: top left; }
  /* Slide tab strip below the preview */
  .slide-bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center;
    max-width: 100%; }
  .slide-bar button { padding:8px 14px; background:transparent; color:var(--fg-muted);
    border:1px solid rgba(13,106,106,0.5); border-radius:999px; cursor:pointer;
    font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; }
  .slide-bar button.active { background:var(--primary); color:var(--natt-500); border-color:var(--primary); }
  .slide-bar button.add { color:var(--chrome); border-style:dashed; }
  .slide-bar button.remove { color:#fb7185; border-color:rgba(251,113,133,0.4); }
  .slide-bar button:hover { color:var(--fg); }
  /* Aspect ratio picker (sidebar) — same look as chrome-row */
  .aspect-row { display:flex; gap:6px; }
  .aspect-row button { flex:1; padding:8px; background:transparent; color:var(--fg-muted);
    border:1px solid rgba(13,106,106,0.5); border-radius:6px; cursor:pointer;
    font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; }
  .aspect-row button.active { background:var(--primary); color:var(--natt-500); border-color:var(--primary); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .sidebar { max-height: none; }
  }
  .chrome-row { display:flex; gap:6px; }
  .chrome-row button { flex:1; padding:8px; background:transparent; color:var(--fg-muted);
    border:1px solid rgba(13,106,106,0.5); border-radius:6px; cursor:pointer;
    font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; }
  .chrome-row button.active { background:var(--primary); color:var(--natt-500); border-color:var(--primary); }
  .accent-row { display:flex; gap:6px; flex-wrap:wrap; }
  .accent-row button { padding: 6px 12px; background: transparent; border:1px solid rgba(13,106,106,0.5);
    border-radius: 999px; cursor:pointer; font-family: var(--font-heading); font-weight:700;
    font-size: 11px; letter-spacing: 0.08em; color: var(--fg-muted); text-transform:uppercase; }
  .accent-row button.active { color: var(--natt-500); }
  .accent-row button[data-acc="primary"].active { background:#54c59e; }
  .accent-row button[data-acc="qb"].active      { background:#fbbf24; }
  .accent-row button[data-acc="rb"].active      { background:#34d399; }
  .accent-row button[data-acc="def"].active     { background:#fb7185; }
  .accent-row button[data-acc="rusher"].active  { background:#fb923c; }
  .accent-row button[data-acc="blue"].active    { background:#38bdf8; }
  .help-link { font-size:12px; color:var(--primary); text-decoration:none; }
  .list-field .list-row { background:#021018; border:1px solid rgba(13,106,106,0.4);
    border-radius:8px; padding:12px 12px 4px; margin-bottom:10px; }
  .list-field .list-row-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .list-field .list-row-label { font-family:var(--font-heading); font-weight:700; font-size:11px;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--chrome); }
  .list-field .list-row-remove { background:transparent; border:1px solid rgba(13,106,106,0.5);
    color:var(--fg-muted); border-radius:6px; width:24px; height:24px; cursor:pointer;
    font-size:16px; line-height:1; padding:0; }
  .list-field .list-row-remove:hover { color:#fb7185; border-color:#fb7185; }
  .list-field .list-add { width:100%; padding:10px; background:transparent; color:var(--chrome);
    border:1px dashed rgba(13,106,106,0.6); border-radius:6px; cursor:pointer;
    font-family:var(--font-heading); font-weight:700; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; }
  .list-field .list-add:hover { border-color:var(--chrome); background:rgba(84,197,158,0.05); }

  /* Figure (coordinate-based diagram) editor */
  .fig-field .fig-row { background:#021018; border:1px solid rgba(13,106,106,0.4);
    border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .fig-field .fig-row-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .fig-field .fig-row-head select { flex:0 0 auto; background:#08141a; color:var(--fg);
    border:1px solid rgba(13,106,106,0.5); border-radius:6px; padding:5px 8px;
    font-family:var(--font-body); font-size:12px; }
  .fig-field .fig-row-head .fig-swatch { width:14px; height:14px; border-radius:50%; border:1px solid rgba(255,255,255,0.2); flex:0 0 auto; }
  .fig-field .fig-row-head .fig-spacer { flex:1; }
  .fig-field .fig-row-head .fig-remove { background:transparent; border:1px solid rgba(13,106,106,0.5);
    color:var(--fg-muted); border-radius:6px; width:24px; height:24px; cursor:pointer;
    font-size:14px; line-height:1; padding:0; }
  .fig-field .fig-row-head .fig-remove:hover { color:#fb7185; border-color:#fb7185; }
  .fig-field .fig-coords { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:flex-end; }
  .fig-field .fig-mini { display:flex; flex-direction:column; gap:2px; font-family:var(--font-body);
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--fg-muted); }
  .fig-field .fig-mini input { width:64px; padding:6px 8px; background:#08141a; color:var(--fg);
    border:1px solid rgba(13,106,106,0.5); border-radius:5px; font-family:var(--font-body); font-size:13px; }
  .fig-field .fig-mini.fig-wide input { width:100%; min-width:260px; }
  .fig-field .fig-mini.fig-wide { flex:1; }
  .fig-field .fig-add-row { display:flex; gap:6px; margin-top:4px; }
  .fig-field .fig-add-row select { flex:1; background:transparent; color:var(--chrome);
    border:1px dashed rgba(13,106,106,0.6); border-radius:6px; padding:8px;
    font-family:var(--font-heading); font-weight:700; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; }
  .fig-field .fig-add-row button { padding:8px 14px; background:var(--chrome); color:var(--natt-500);
    border:none; border-radius:6px; font-family:var(--font-heading); font-weight:800; font-size:12px;
    letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; }
  .fig-field .fig-add-row { flex-wrap:wrap; }
  .fig-field .fig-add-pill { flex:1 1 calc(50% - 6px); padding:8px 6px; background:transparent;
    color:var(--chrome); border:1px dashed rgba(13,106,106,0.6); border-radius:6px;
    font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; cursor:pointer; }
  .fig-field .fig-add-pill:hover { border-style:solid; background:rgba(84,197,158,0.05); }
  .fig-field .fig-type-pills { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
  .fig-field .fig-type-pill { flex:1 1 0; min-width:60px; padding:6px 4px; background:transparent;
    color:var(--fg-muted); border:1px solid rgba(13,106,106,0.5); border-radius:6px;
    font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; cursor:pointer; }
  .fig-field .fig-type-pill:hover { color:var(--fg); border-color:var(--primary); }
  .fig-field .fig-type-pill.active { background:var(--primary); color:var(--natt-500); border-color:var(--primary); }
  .fig-field .fig-legend { font-family:var(--font-body); font-size:11px; color:var(--fg-muted);
    margin:2px 0 8px 0; line-height:1.5; }
  .fig-field .fig-legend code { background:#08141a; padding:1px 5px; border-radius:3px; color:var(--chrome); font-size:11px; }
  .fig-field .fig-route { margin-top:10px; padding-top:8px; border-top:1px dashed rgba(13,106,106,0.4); }
  .fig-field .fig-route-label { font-family:var(--font-body); font-size:11px; color:var(--fg-muted);
    text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
  .fig-field .fig-route-empty { font-family:var(--font-body); font-size:11px; color:var(--fg-muted);
    font-style:italic; padding:4px 0 6px; }
  .fig-field .fig-route-row { display:flex; align-items:flex-end; gap:6px; margin-bottom:6px; }
  .fig-field .fig-route-tag { display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:#08141a; border:1px solid rgba(13,106,106,0.5);
    color:var(--chrome); font-family:var(--font-heading); font-weight:800; font-size:11px; align-self:center; }
  .fig-field .fig-add-pt { flex:1 1 100%; margin-top:4px; }

  /* Curated color-swatch picker (per-half team accent on T11 Matchup) */
  .colorpick-row { display:flex; gap:8px; flex-wrap:wrap; }
  .colorpick-swatch { width:36px; height:36px; border-radius:50%; border:2px solid rgba(13,106,106,0.5);
    cursor:pointer; padding:0; transition:transform 0.12s, border-color 0.12s; position:relative; }
  .colorpick-swatch:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.4); }
  .colorpick-swatch.active { border-color: var(--fg); box-shadow: 0 0 0 2px rgba(240,252,250,0.15); }
  .colorpick-swatch.active::after { content:'✓'; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; color:#021018; font-weight:800; font-size:18px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.4); }

  /* Per-field image upload (used by Matchup) */
  .image-field .image-upload { padding:14px; border:1.5px dashed rgba(13,106,106,0.6); border-radius:8px;
    text-align:center; cursor:pointer; transition:all 0.2s; display:block; }
  .image-field .image-upload:hover { border-color:var(--primary); background:rgba(84,197,158,0.05); }
  .image-field .image-upload input { display:none; }
  .image-field .image-upload.has-image { border-style:solid; border-color:var(--primary);
    background:rgba(84,197,158,0.08); padding:10px; }
  .image-field .image-upload.has-image .image-thumb { width:100%; height:80px; border-radius:6px;
    background-size:cover; background-position:center; margin-bottom:8px; }
  .image-field .iu-label { font-family:var(--font-heading); font-weight:700; font-size:12px;
    color:var(--primary); letter-spacing:0.08em; text-transform:uppercase; }
  .image-field .iu-hint { font-size:11px; color:var(--fg-muted); margin-top:4px; }
  .image-field .image-remove { margin-top:6px; background:transparent; color:var(--fg-muted);
    border:1px solid rgba(13,106,106,0.5); border-radius:6px; padding:6px 10px; cursor:pointer;
    font-family:var(--font-body); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; }
  .image-field .image-remove:hover { color:#fb7185; border-color:#fb7185; }
</style>
</head>
<body>

<aside class="sidebar">
  <h1>Frame editor</h1>
  <p class="lead">Pick a template, fill in fields, drop in a photo, export 1080×1080. <a class="help-link" href="index.html">← back to all templates</a></p>

  <h3>1. Template</h3>
  <div class="picker" id="picker">
    <button data-tpl="player" class="active">T01 · Player</button>
    <button data-tpl="pos101">T02 · Position 101</button>
    <button data-tpl="schedule">T03 · Schedule</button>
    <button data-tpl="event">T04 · Event ⭐</button>
    <button data-tpl="nm">T05 · NM</button>
    <button data-tpl="rule">T06 · Rule</button>
    <button data-tpl="drill">T07 · Play</button>
    <button data-tpl="welcome">T08 · Bli med</button>
    <button data-tpl="bts">T09 · BTS</button>
    <button data-tpl="fact">T10 · Visste du?</button>
    <button data-tpl="matchup">T11 · Matchup</button>
  </div>

  <h3>2. Chrome</h3>
  <div class="chrome-row">
    <button data-chrome="curve" class="active">Curved</button>
    <button data-chrome="diag">Diagonal</button>
    <button data-chrome="none">None</button>
  </div>

  <h3>3. Accent color</h3>
  <div class="accent-row" id="accent-row">
    <button data-acc="primary" class="active">Primary</button>
    <button data-acc="qb">QB Yellow</button>
    <button data-acc="rb">RB Green</button>
    <button data-acc="def">Defense</button>
    <button data-acc="rusher">Rusher</button>
    <button data-acc="blue">WR Blue</button>
  </div>

  <h3>4. Content</h3>
  <div id="form-area"></div>

  <h3>5. Photo (optional)</h3>
  <label class="upload" id="upload">
    <input type="file" id="photo-input" accept="image/*">
    <div class="upload-label" id="upload-label">Drop or click to upload</div>
    <div class="upload-hint">JPG/PNG · 1080×1080 ideal</div>
  </label>
  <div style="display:flex; align-items:center; gap:8px; margin-top:10px; font-family:var(--font-body); font-size:13px; color:var(--fg-muted);">
    <input type="checkbox" id="bg-remove-toggle" style="width:auto; accent-color: var(--primary);">
    <label for="bg-remove-toggle" style="cursor:pointer;">Auto-remove background on upload</label>
    <a href="bg-remover.html" target="_blank" style="margin-left:auto; color: var(--primary); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; font-family:var(--font-heading); font-weight:700;">Tool ↗</a>
  </div>
  <div style="font-size:11px; color:var(--fg-muted); margin-top:4px; line-height:1.5;">First run downloads ~70MB. Then ~5s/image.</div>

  <div class="actions">
    <button class="secondary" id="reset-btn">Reset fields</button>
    <button id="export-btn">Export PNG (1080)</button>
  </div>
</aside>

<main class="preview-area">
  <div class="preview-wrap" id="preview-wrap"></div>
</main>

<script>
  // ----------------------------------------------------------------
  // Template definitions: schema (form fields) + render (HTML body).
  // Render returns the *inside* of .tile (chrome + wordmark added by host).
  // ----------------------------------------------------------------
  const T = {};

  T.player = {
    label: 'Player intro',
    fields: [
      { id:'eyebrow', label:'Eyebrow', type:'text', default:'Møt laget · 04 av 18' },
      { id:'first', label:'First name', type:'text', default:'Magnus' },
      { id:'last', label:'Last name', type:'text', default:'Sætre' },
      { id:'jersey', label:'Jersey #', type:'text', default:'07' },
      { id:'pos_label', label:'Position label', type:'text', default:'QUARTERBACK · #07' },
      { id:'season', label:'Sesong', type:'text', default:'3.' },
      { id:'from', label:'Fra', type:'text', default:'Tromsdalen' },
      { id:'background', label:'Bakgrunn', type:'text', default:'Håndball' },
      { id:'quote', label:'Quote', type:'textarea', default:'«Det handler om å lese spillet før det skjer.»' },
      { id:'wm_right', label:'Wordmark right', type:'text', default:'QB · 69° NORD' },
    ],
    render: d => {
      // Initial guess; we measure-and-shrink after render (see fitPlayerName in renderPreview).
      return `<div class="stage">
      <div class="left-col"><div class="ph photo" data-photo data-label="[ player photo ]"></div></div>
      <div class="jersey">${d.jersey}</div>
      <div class="right-col">
        <div class="eyebrow">${d.eyebrow}</div>
        <div class="h-display player-name" style="font-size:84px;">${d.first}<br>${d.last}</div>
        <div style="display:inline-block; padding:8px 20px; background:rgba(251,191,36,0.15); border:1px solid currentColor; color:var(--chrome); font-family:var(--font-heading); font-weight:800; letter-spacing:0.18em; font-size:22px; border-radius:999px; align-self:flex-start;">${d.pos_label}</div>
        <div style="border-top:1px solid rgba(13,106,106,0.4); padding-top:24px; display:flex; flex-direction:column; gap:14px; font-family:var(--font-body); font-size:24px; color:var(--fg-muted);">
          <div style="display:flex; justify-content:space-between;"><span>Sesong</span><span style="color:var(--fg); font-family:var(--font-heading); font-weight:700;">${d.season}</span></div>
          <div style="display:flex; justify-content:space-between;"><span>Fra</span><span style="color:var(--fg); font-family:var(--font-heading); font-weight:700;">${d.from}</span></div>
          <div style="display:flex; justify-content:space-between;"><span>Bakgrunn</span><span style="color:var(--fg); font-family:var(--font-heading); font-weight:700;">${d.background}</span></div>
        </div>
        <div style="font-family:var(--font-heading); font-weight:700; font-size:24px; color:var(--fg); margin-top:8px; line-height:1.4;">${d.quote}</div>
      </div>
    </div>`;
    },
    cls: 't-player',
  };

  T.pos101 = {
    label: 'Position 101',
    fields: [
      { id:'eyebrow', label:'Eyebrow', type:'text', default:'Posisjonsskolen · 03 av 07' },
      { id:'abbr', label:'Position abbr (2-3 chars)', type:'text', default:'RB' },
      { id:'name', label:'Position name', type:'text', default:'Running back' },
      { id:'tagline', label:'Tagline', type:'textarea', default:'Eksplosiv ballbærer. Tar både handoffs og korte pasninger. Trenger akselerasjon over de første 5 yardene.' },
      { id:'r1', label:'Responsibility 1', type:'text', default:'Mottar handoffs i bakfeltet' },
      { id:'r2', label:'Responsibility 2', type:'text', default:'Sekundærmottaker på pasning' },
      { id:'r3', label:'Responsibility 3', type:'text', default:'Blokkerer rushere' },
      { id:'r4', label:'Responsibility 4', type:'text', default:'Leser hull i forsvaret' },
      { id:'wm_right', label:'Wordmark right', type:'text', default:'POSISJONSSKOLEN' },
    ],
    render: d => `<div class="stage">
      <div class="eyebrow">${d.eyebrow}</div>
      <div class="pos-abbr" style="font-family:var(--font-heading); font-weight:800; font-size:360px; line-height:0.82; color:var(--chrome); letter-spacing:-0.04em; margin-top:-8px;">${d.abbr}</div>
      <div style="display:flex; flex-direction:column; gap:16px; max-width:880px;">
        <div class="h-display" style="font-size:72px; line-height:0.95;">${d.name}</div>

  // ----------------------------------------------------------------
  // FOOTBALL-FIELD FIGURE SYSTEM
  // LOGICAL coords are yards: x = down-field (0=our back-of-endzone,
  // 70=opposing back-of-endzone, goal lines at 10 and 60), y = cross-field 0–25.
  // The renderer crops to a VERTICAL window: x ∈ [FIG_XMIN, FIG_XMAX], with
  // FIG_XMIN at the bottom of the rendered SVG. By default we show 2 yards of
  // our own end zone peeking up + 25 yards of open field — ball spotted at
  // our own 5-yard line (x=15).
  // Shape schema:
  //   { type:'point',  x, y,        color, label? }
  //   { type:'line',   x1,y1,x2,y2, color, width? }
  //   { type:'arrow',  x1,y1,x2,y2, color, width? }   // arrowhead at (x2,y2)
  //   { type:'area',   points:[[x,y],…], color }
  // color is a *named* token (white|primary|qb|rb|wr|def|rusher|chrome).
  // ----------------------------------------------------------------
  const FIG_XMIN = 8;                         // bottom of view (2 yd into own end zone)
  const FIG_XMAX = 35;                        // top of view (own 25-yd line)
  const FIG_VIEW_W = 25;                      // cross-field yards
  const FIG_VIEW_H = FIG_XMAX - FIG_XMIN;     // 27 yards visible
  // Logical (x = down-field, y = cross-field) → SVG (sx, sy).
  // Bottom of rendered field = own end zone, top = upfield toward opponent.
  const figTx = (x, y) => ({ sx: y, sy: FIG_XMAX - x });
  const FIG_COLORS = {
    white:   { hex: '#f0fcfa', label: 'White' },
    lightgrey: { hex: '#d4d4d4', label: 'Light grey' },
    black:   { hex: '#0a0a0a', label: 'Black' },
    primary: { hex: '#54c59e', label: 'Primary' },
    chrome:  { hex: 'var(--chrome)', label: 'Chrome (accent)' },
    qb:      { hex: '#fbbf24', label: 'QB Yellow' },
    rb:      { hex: '#34d399', label: 'RB Green' },
    wr:      { hex: '#38bdf8', label: 'WR Blue' },
    def:     { hex: '#fb7185', label: 'Defense Rose' },
    rusher:  { hex: '#fb923c', label: 'Rusher Orange' },
  };
  const figColor = name => (FIG_COLORS[name] || FIG_COLORS.white).hex;

  function renderFootballField() {
    // Vertical, cropped field: 25 wide × 27 tall (yards).
    // Own end zone occupies SVG y:25→27 (the 2 yards of x∈[8,10]).
    // Goal line at SVG y = 35 - 10 = 25.
    // Yard lines at x = 15,20,25,30 (own 5/10/15/20-yd lines).
    return `
      <rect x="0" y="0" width="${FIG_VIEW_W}" height="${FIG_VIEW_H}" fill="#0d2f24"/>
      <rect x="0" y="${FIG_XMAX - 10}" width="${FIG_VIEW_W}" height="2" fill="rgba(84,197,158,0.22)"/>
      ${[15,20,25,30].map(x => {
        const sy = FIG_XMAX - x;
        return `<line x1="0.6" y1="${sy}" x2="${FIG_VIEW_W - 0.6}" y2="${sy}" stroke="rgba(255,255,255,0.14)" stroke-width="${x%10===0?0.08:0.05}"${x%10===0?'':' stroke-dasharray="0.5 0.7"'}/>`;
      }).join('')}
      <line x1="0" y1="${FIG_XMAX - 10}" x2="${FIG_VIEW_W}" y2="${FIG_XMAX - 10}" stroke="#f0fcfa" stroke-width="0.18"/>
      <rect x="0" y="0" width="${FIG_VIEW_W}" height="${FIG_VIEW_H}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.12"/>
      ${[15,20,25,30].map(x => `<circle cx="${FIG_VIEW_W/2}" cy="${FIG_XMAX - x}" r="0.14" fill="rgba(255,255,255,0.4)"/>`).join('')}
    `;
  }

  function renderFigureShape(s) {
    const c = figColor(s.color);
    const w = s.width || 0.28;
    if (s.type === 'point') {
      const { sx, sy } = figTx(s.x, s.y);
      const r = s.r || 0.85;
      return `<circle cx="${sx}" cy="${sy}" r="${r}" fill="${c}" stroke="#021018" stroke-width="0.12"/>` +
        (s.label ? `<text x="${sx}" y="${sy + 0.35}" fill="#021018" font-family="Syne, sans-serif" font-weight="800" font-size="1.0" text-anchor="middle" style="pointer-events:none;">${s.label}</text>` : '');
    }
    if (s.type === 'line') {
      const a = figTx(s.x1, s.y1), b = figTx(s.x2, s.y2);
      return `<line x1="${a.sx}" y1="${a.sy}" x2="${b.sx}" y2="${b.sy}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
    }
    if (s.type === 'arrow') {
      const a = figTx(s.x1, s.y1), b = figTx(s.x2, s.y2);
      const dx = b.sx - a.sx, dy = b.sy - a.sy;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const head = 1.4;                       // arrowhead length in yards
      const bx = b.sx - ux * head, by = b.sy - uy * head;
      const px = -uy * head * 0.55, py = ux * head * 0.55;
      return `<line x1="${a.sx}" y1="${a.sy}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>
        <polygon points="${b.sx},${b.sy} ${bx + px},${by + py} ${bx - px},${by - py}" fill="${c}"/>`;
    }
    if (s.type === 'area') {
      const pts = (s.points || []).map(p => { const t = figTx(p[0], p[1]); return `${t.sx},${t.sy}`; }).join(' ');
      const sw = s.width || 0.14;
      return `<polygon points="${pts}" fill="${c}" fill-opacity="0.24" stroke="${c}" stroke-width="${sw}"/>`;
    }
    return '';
  }

  function renderFigure(shapes) {
    return `<svg viewBox="0 0 ${FIG_VIEW_W} ${FIG_VIEW_H}" preserveAspectRatio="xMidYMid meet" style="position:absolute; inset:0; width:100%; height:100%;">
      ${renderFootballField()}
      ${(shapes || []).map(renderFigureShape).join('')}
    </svg>`;
  }

  // Blank shape factory.
  function newFigureShape(type) {
    if (type === 'point') return { type:'point', x:35, y:12.5, color:'qb', label:'' };
    if (type === 'line')  return { type:'line',  x1:10, y1:12.5, x2:60, y2:12.5, color:'white' };
    if (type === 'arrow') return { type:'arrow', x1:35, y1:18,   x2:50, y2:8,    color:'wr' };
    if (type === 'area')  return { type:'area',  points:[[10,5],[60,5],[60,20],[10,20]], color:'primary' };
    return { type:'point', x:35, y:12.5, color:'qb' };
  }

  // ---------- PLAY (player + route) FIGURE ----------
  // A "player" entry: { label, color, x, y, route: [[x,y], ...] }
  // The route is drawn as a polyline from (x,y) through each waypoint, with an
  // arrowhead at the last point oriented along the final segment.
  function newPlayer(seed) {
    return Object.assign({
      label: '',
      color: 'wr',
      x: 15,
      y: 12.5,
      r: 0.95,
      width: 0.32,
      route: [[20, 12.5]],
    }, seed || {});
  }

  function renderPlayPlayer(p) {
    const c = figColor(p.color);
    const w = p.width || 0.32;
    const r = p.r || 0.95;
    const start = figTx(p.x, p.y);
    const route = (p.route || []).map(pt => figTx(pt[0], pt[1]));
    let path = '';
    if (route.length) {
      const pts = [start, ...route];
      // All segments except the last drawn as a polyline.
      const head = route[route.length - 1];
      const beforeHead = pts[pts.length - 2];
      const polyPts = pts.slice(0, -1).map(pt => `${pt.sx},${pt.sy}`).join(' ');
      path += `<polyline points="${polyPts}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      // Final segment with arrowhead at the last waypoint.
      const dx = head.sx - beforeHead.sx, dy = head.sy - beforeHead.sy;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const headLen = 1.4;
      const bx = head.sx - ux * headLen, by = head.sy - uy * headLen;
      const px = -uy * headLen * 0.55, py = ux * headLen * 0.55;
      path += `<line x1="${beforeHead.sx}" y1="${beforeHead.sy}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>
        <polygon points="${head.sx},${head.sy} ${bx + px},${by + py} ${bx - px},${by - py}" fill="${c}"/>`;
    }
    const dot = `<circle cx="${start.sx}" cy="${start.sy}" r="${r}" fill="${c}" stroke="#021018" stroke-width="0.14"/>` +
      (p.label ? `<text x="${start.sx}" y="${start.sy + 0.38}" fill="#021018" font-family="Syne, sans-serif" font-weight="800" font-size="1.1" text-anchor="middle" style="pointer-events:none;">${p.label}</text>` : '');
    return path + dot;
  }

    render: d => `<div class="stage">

  // Curated swatches for matchup team accents. Each entry: [hex, label].
  const MATCHUP_COLORS = [
    ['#38bdf8', 'WR Blue'],
    ['#fb7185', 'Defense Rose'],
    ['#fbbf24', 'QB Yellow'],
    ['#34d399', 'RB Green'],
    ['#fb923c', 'Rusher Orange'],
    ['#54c59e', 'Primary'],
    ['#a78bfa', 'Violet'],
    ['#f0fcfa', 'Is'],
  ];
  // #rrggbb → "r,g,b" for use in rgba(). Falls back to a sky-blue.
  const hexToRgb = h => {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h || '');
    return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '56,189,248';
  };

  T.matchup = {

      { id:'dPhoto', label:'Def — photo', type:'image', default:'' },

        <div class="half ${side}" style="background:linear-gradient(180deg, rgba(${r},0.18) 0%, rgba(${r},0.04) 100%);">

          </div>

      return `<div class="stage">
        ${half('off', oC, oR, d.oPhoto, 'angrep · photo', 'ANGREP', d.oFirst, d.oLast, d.oTag,

        <div class="vs">VS</div>
        ${half('def', dC, dR, d.dPhoto, 'forsvar · photo', 'FORSVAR', d.dFirst, d.dLast, d.dTag,
          [[d.dS1l,d.dS1v],[d.dS2l,d.dS2v],[d.dS3l,d.dS3v]])}

  // ----------------------------------------------------------------
  // App state
  // ----------------------------------------------------------------
  const state = {
    tpl: 'player',
    chrome: 'curve',
    accent: 'primary',
    photo: null,
    values: {},
  };

  function loadDefaults(tplId) {
    const t = T[tplId];
    state.values = {};
    // Deep-clone defaults so list edits don't mutate the schema.
    t.fields.forEach(f => state.values[f.id] = JSON.parse(JSON.stringify(f.default)));
  }
  loadDefaults('player');

  // ----------------------------------------------------------------
  // Render form for current template
  // ----------------------------------------------------------------
  const escAttr = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function renderForm() {
    const t = T[state.tpl];
    const area = document.getElementById('form-area');
    area.innerHTML = t.fields.map(f => {
      const v = state.values[f.id] ?? f.default;
      if (f.type === 'list') {
        const rows = (v || []).map((row, i) => `
          <div class="list-row" data-list="${f.id}" data-row="${i}">
            <div class="list-row-head">
              <span class="list-row-label">${f.label.slice(0,-1) || 'Item'} ${i+1}</span>
              <button type="button" class="list-row-remove" data-remove="${f.id}|${i}" title="Remove">×</button>
            </div>
            ${f.item.map(sf => `<div class="field" style="margin-bottom:8px;"><label>${sf.label}</label><input type="text" data-list-field="${f.id}|${i}|${sf.id}" value="${escAttr(row[sf.id] ?? sf.default ?? '')}"></div>`).join('')}
          </div>`).join('');
        return `<div class="field list-field"><label>${f.label}</label>${rows}<button type="button" class="list-add" data-add="${f.id}">＋ Add ${f.label.slice(0,-1).toLowerCase()}</button></div>`;
      }
      if (f.type === 'figure') {
        const rows = (v || []).map((sh, i) => {
          const swatch = `<span class="fig-swatch" style="background:${figColor(sh.color)}"></span>`;
          const colorSel = `<select data-fig="${f.id}|${i}|color">${
            Object.entries(FIG_COLORS).map(([k, c]) =>
              `<option value="${k}"${sh.color===k?' selected':''}>${c.label}</option>`).join('')
          }</select>`;
          const typePills = `<div class="fig-type-pills">${
            ['point','line','arrow','area'].map(t =>
              `<button type="button" class="fig-type-pill${sh.type===t?' active':''}" data-fig-type="${f.id}|${i}|${t}">${t}</button>`).join('')
          }</div>`;
          const num = (lab, key, val) =>
            `<label class="fig-mini">${lab}<input type="number" step="0.5" data-fig-num="${f.id}|${i}|${key}" value="${val ?? 0}"></label>`;
          const numStep = (lab, key, val, step, def) =>
            `<label class="fig-mini">${lab}<input type="number" step="${step}" min="0" data-fig-num="${f.id}|${i}|${key}" value="${val ?? def}"></label>`;
          let coords = '';
          if (sh.type === 'point') {
            coords = num('x','x',sh.x) + num('y','y',sh.y) +
              numStep('size','r',sh.r,0.1,0.85) +
              `<label class="fig-mini fig-wide">label<input type="text" data-fig-text="${f.id}|${i}|label" value="${escAttr(sh.label||'')}"></label>`;
          } else if (sh.type === 'line' || sh.type === 'arrow') {
            coords = num('x1','x1',sh.x1) + num('y1','y1',sh.y1) +
                     num('x2','x2',sh.x2) + num('y2','y2',sh.y2) +
                     numStep('weight','width',sh.width,0.05,0.28);
          } else if (sh.type === 'area') {
            const pv = (sh.points||[]).map(p => `${p[0]},${p[1]}`).join('; ');
            coords = `<label class="fig-mini fig-wide">points (x,y; x,y; …)<input type="text" data-fig-pts="${f.id}|${i}" value="${escAttr(pv)}"></label>` +
                     numStep('outline','width',sh.width,0.05,0.14);
          }
          return `<div class="fig-row">
            <div class="fig-row-head">
              ${colorSel}${swatch}
              <span class="fig-spacer"></span>
              <button type="button" class="fig-remove" data-fig-remove="${f.id}|${i}" title="Remove">×</button>
            </div>
            ${typePills}
            <div class="fig-coords">${coords}</div>
          </div>`;
        }).join('');
        return `<div class="field fig-field"><label>${f.label}</label>
          <div class="fig-legend">Football field is <code>70×25</code> yards. End zones <code>x: 0–10</code> and <code>x: 60–70</code>. Goal lines at <code>x=10</code> and <code>x=60</code>. Width runs <code>y: 0–25</code>.</div>
          ${rows}
          <div class="fig-add-row">
            ${['point','line','arrow','area'].map(t =>
              `<button type="button" class="fig-add-pill" data-fig-add="${f.id}|${t}">＋ ${t}</button>`).join('')}
          </div>
        </div>`;
      }
      if (f.type === 'players') {
        const rows = (v || []).map((p, i) => {
          const swatch = `<span class="fig-swatch" style="background:${figColor(p.color)}"></span>`;
          const colorSel = `<select data-ply="${f.id}|${i}|color">${
            Object.entries(FIG_COLORS).map(([k, c]) =>
              `<option value="${k}"${p.color===k?' selected':''}>${c.label}</option>`).join('')
          }</select>`;
          const num = (lab, key, val, step, def) =>
            `<label class="fig-mini">${lab}<input type="number" step="${step}" data-ply-num="${f.id}|${i}|${key}" value="${val ?? def}"></label>`;
          const start =
            `<label class="fig-mini">label<input type="text" data-ply-text="${f.id}|${i}|label" value="${escAttr(p.label||'')}"></label>` +
            num('x','x',p.x,0.5,15) + num('y','y',p.y,0.5,12.5) +
            num('size','r',p.r,0.1,0.95) + num('weight','width',p.width,0.05,0.32);
          const route = (p.route || []).map((pt, j) => `
            <div class="fig-route-row">
              <span class="fig-route-tag">${j+1}</span>
              <label class="fig-mini">x<input type="number" step="0.5" data-ply-pt="${f.id}|${i}|${j}|0" value="${pt[0]}"></label>
              <label class="fig-mini">y<input type="number" step="0.5" data-ply-pt="${f.id}|${i}|${j}|1" value="${pt[1]}"></label>
              <button type="button" class="fig-remove" data-ply-pt-remove="${f.id}|${i}|${j}" title="Remove point">×</button>
            </div>`).join('');
          return `<div class="fig-row">
            <div class="fig-row-head">
              ${colorSel}${swatch}
              <span class="fig-spacer"></span>
              <button type="button" class="fig-remove" data-ply-remove="${f.id}|${i}" title="Remove player">×</button>
            </div>
            <div class="fig-coords">${start}</div>
            <div class="fig-route">
              <div class="fig-route-label">Route waypoints (arrow on last)</div>
              ${route || '<div class="fig-route-empty">No waypoints — player stays put.</div>'}
              <button type="button" class="fig-add-pill fig-add-pt" data-ply-pt-add="${f.id}|${i}">＋ waypoint</button>
            </div>
          </div>`;
        }).join('');
        return `<div class="field fig-field"><label>${f.label}</label>
          <div class="fig-legend">Same field as Rule. Default view shows <code>x: 8–35</code>, <code>y: 0–25</code> (own end zone + 25 yd).</div>
          ${rows}
          <div class="fig-add-row">
            <button type="button" class="fig-add-pill" data-ply-add="${f.id}">＋ player</button>
          </div>
        </div>`;
      }
      if (f.type === 'drawing') {
        return `<div class="field drawing-field">
          <label>${f.label}</label>
          <div class="drawing-toolbar" data-drawing="${f.id}">
            <div class="dr-group">
              <button type="button" class="dr-color active" data-color="#f0fcfa" style="background:#f0fcfa" title="White"></button>
              <button type="button" class="dr-color" data-color="#54c59e" style="background:#54c59e" title="Green"></button>
              <button type="button" class="dr-color" data-color="#fbbf24" style="background:#fbbf24" title="Yellow"></button>
              <button type="button" class="dr-color" data-color="#fb7185" style="background:#fb7185" title="Rose"></button>
              <button type="button" class="dr-color" data-color="#38bdf8" style="background:#38bdf8" title="Blue"></button>
            </div>
            <div class="dr-group">
              <button type="button" class="dr-size" data-size="3" title="Thin"><span style="width:6px;height:6px;"></span></button>
              <button type="button" class="dr-size active" data-size="6" title="Medium"><span style="width:10px;height:10px;"></span></button>
              <button type="button" class="dr-size" data-size="12" title="Thick"><span style="width:14px;height:14px;"></span></button>
            </div>
            <div class="dr-group dr-spacer">
              <button type="button" class="dr-undo">↶ Undo</button>
              <button type="button" class="dr-clear">Clear</button>
            </div>
          </div>
          <svg class="drawing-canvas" viewBox="0 0 800 280" preserveAspectRatio="xMidYMid meet" data-drawing-canvas="${f.id}">
            <line x1="0" y1="56"  x2="800" y2="56"  stroke="rgba(255,255,255,0.10)" stroke-dasharray="6 6"/>
            <line x1="0" y1="140" x2="800" y2="140" stroke="rgba(255,255,255,0.14)" stroke-dasharray="6 6"/>
            <line x1="0" y1="224" x2="800" y2="224" stroke="rgba(255,255,255,0.10)" stroke-dasharray="6 6"/>
            <g class="dr-strokes">${renderStrokes(v)}</g>
          </svg>
          <div class="drawing-hint">Drag på lerretet for å tegne. Streker skalerer crisp i preview.</div>
        </div>`;
      }
      if (f.type === 'colorPick') {
        const swatches = MATCHUP_COLORS.map(([hex, lbl]) =>
          `<button type="button" class="colorpick-swatch${v === hex ? ' active' : ''}" data-color-pick="${f.id}|${hex}" style="background:${hex}" title="${lbl}"></button>`
        ).join('');
        return `<div class="field"><label>${f.label}</label><div class="colorpick-row">${swatches}</div></div>`;
      }
      if (f.type === 'image') {
        const hasImg = !!v;
        return `<div class="field image-field"><label>${f.label}</label>
          <label class="image-upload${hasImg ? ' has-image' : ''}">
            <input type="file" accept="image/*" data-image-input="${f.id}">
            ${hasImg ? `<div class="image-thumb" style="background-image:url(${v});"></div>` : ''}
            <div class="iu-label">${hasImg ? '✓ Image loaded · click to replace' : 'Drop or click to upload'}</div>
            ${hasImg ? '' : '<div class="iu-hint">JPG/PNG · portrait or landscape</div>'}
          </label>
          ${hasImg ? `<button type="button" class="image-remove" data-image-remove="${f.id}">Remove image</button>` : ''}
        </div>`;
      }
      const esc = escAttr(v);
      if (f.type === 'textarea') {
        return `<div class="field"><label>${f.label}</label><textarea data-field="${f.id}">${esc}</textarea></div>`;
      }
      return `<div class="field"><label>${f.label}</label><input type="text" data-field="${f.id}" value="${esc}"></div>`;

    area.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', e => {
        state.values[e.target.dataset.field] = e.target.value;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-list-field]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, sfid] = e.target.dataset.listField.split('|');
        state.values[fid][+idx][sfid] = e.target.value;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-add]').forEach(btn => {
      btn.addEventListener('click', e => {
        const fid = e.currentTarget.dataset.add;
        const f = t.fields.find(x => x.id === fid);
        const blank = {};
        f.item.forEach(sf => blank[sf.id] = sf.default ?? '');
        state.values[fid].push(blank);
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.remove.split('|');
        state.values[fid].splice(+idx, 1);
        renderForm();
        renderPreview();
      });
    });

    area.querySelectorAll('[data-color-pick]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, color] = e.currentTarget.dataset.colorPick.split('|');
        state.values[fid] = color;
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-image-input]').forEach(inp => {
      inp.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const fid = e.target.dataset.imageInput;
        const reader = new FileReader();
        reader.onload = ev => {
          state.values[fid] = ev.target.result;
          renderForm();
          renderPreview();
        };
        reader.readAsDataURL(file);
      });
    });
    area.querySelectorAll('[data-image-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const fid = e.currentTarget.dataset.imageRemove;
        state.values[fid] = '';
        renderForm();
        renderPreview();
      });
    });

    // ---------- FIGURE field handlers ----------
    area.querySelectorAll('[data-fig]').forEach(sel => {
      sel.addEventListener('change', e => {
        const [fid, idx, key] = e.target.dataset.fig.split('|');
        const shape = state.values[fid][+idx];
        if (key === 'color') {
          shape.color = e.target.value;
          renderForm();    // refresh swatch
          renderPreview();
        }
      });
    });
    area.querySelectorAll('[data-fig-type]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx, type] = e.currentTarget.dataset.figType.split('|');
        const shape = state.values[fid][+idx];
        if (shape.type === type) return;
        const fresh = newFigureShape(type);
        fresh.color = shape.color || fresh.color;
        state.values[fid][+idx] = fresh;
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-fig-num]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, key] = e.target.dataset.figNum.split('|');
        const n = parseFloat(e.target.value);
        state.values[fid][+idx][key] = isNaN(n) ? 0 : n;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-fig-text]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, key] = e.target.dataset.figText.split('|');
        state.values[fid][+idx][key] = e.target.value;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-fig-pts]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx] = e.target.dataset.figPts.split('|');
        // Parse "x,y; x,y; ..." → [[x,y],…]; skip malformed pairs.
        const pts = e.target.value.split(';').map(p => {
          const [x, y] = p.split(',').map(s => parseFloat(s.trim()));
          return (isNaN(x) || isNaN(y)) ? null : [x, y];
        }).filter(Boolean);
        state.values[fid][+idx].points = pts;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-fig-add]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, type] = e.currentTarget.dataset.figAdd.split('|');
        state.values[fid].push(newFigureShape(type));
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-fig-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.figRemove.split('|');
        state.values[fid].splice(+idx, 1);
        renderForm();
        renderPreview();
      });
    });

    // ---------- PLAYERS field handlers ----------
    area.querySelectorAll('[data-ply]').forEach(sel => {
      sel.addEventListener('change', e => {
        const [fid, idx, key] = e.target.dataset.ply.split('|');
        if (key === 'color') {
          state.values[fid][+idx].color = e.target.value;
          renderForm();
          renderPreview();
        }
      });
    });
    area.querySelectorAll('[data-ply-num]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, key] = e.target.dataset.plyNum.split('|');
        const n = parseFloat(e.target.value);
        state.values[fid][+idx][key] = isNaN(n) ? 0 : n;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-text]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, key] = e.target.dataset.plyText.split('|');
        state.values[fid][+idx][key] = e.target.value;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-pt]').forEach(inp => {
      inp.addEventListener('input', e => {
        const [fid, idx, j, axis] = e.target.dataset.plyPt.split('|');
        const n = parseFloat(e.target.value);
        state.values[fid][+idx].route[+j][+axis] = isNaN(n) ? 0 : n;
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-pt-add]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.plyPtAdd.split('|');
        const p = state.values[fid][+idx];
        const last = (p.route && p.route.length) ? p.route[p.route.length - 1] : [p.x, p.y];
        p.route = p.route || [];
        p.route.push([Math.min(60, (last[0] || 15) + 4), last[1] || 12.5]);
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-pt-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx, j] = e.currentTarget.dataset.plyPtRemove.split('|');
        state.values[fid][+idx].route.splice(+j, 1);
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-add]').forEach(btn => {
      btn.addEventListener('click', e => {
        const fid = e.currentTarget.dataset.plyAdd;
        state.values[fid].push(newPlayer());
        renderForm();
        renderPreview();
      });
    });
    area.querySelectorAll('[data-ply-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        const [fid, idx] = e.currentTarget.dataset.plyRemove.split('|');
        state.values[fid].splice(+idx, 1);
        renderForm();
        renderPreview();
      });
    });
  }

  // ----------------------------------------------------------------
  // Render preview
  // ----------------------------------------------------------------
  function renderPreview() {
    const t = T[state.tpl];
    const wrap = document.getElementById('preview-wrap');
    fitPreview();
    const accCls = state.accent !== 'primary' ? `acc-${state.accent}` : '';
    const wmRight = state.values.wm_right || '';
    const chromeHtml = state.chrome === 'none' ? '' : window.tileChrome(state.chrome);

    wrap.innerHTML = `<div class="tile ${t.cls} ${accCls}">
      ${chromeHtml}
      ${t.render(state.values)}
      <div class="wordmark"><span class="left">TROMSØ FLAGGFOTBALL</span><span class="right">${wmRight}</span></div>
    </div>`;

    // Apply uploaded photo, if any.
    if (state.photo) {
      const photoEl = wrap.querySelector('[data-photo]');
      if (photoEl) {
        photoEl.style.backgroundImage = `url(${state.photo})`;
        photoEl.classList.remove('ph');
        if (state.photoCutout) {
          photoEl.classList.add('cutout');
        } else {
          photoEl.classList.remove('cutout');
        }
      }
    }

    // Shrink-to-fit player name lines. Done after layout so we can measure
    // each line's scrollWidth against its container's clientWidth, scale
    // font-size by the worst-case ratio, and floor at 28px so it never
    // goes invisible. Runs once per render — fast, no observer needed.
    wrap.querySelectorAll('.player-name').forEach(el => {
      const parent = el.parentElement;
      if (!parent) return;
      // clientWidth includes padding — subtract it to get the real content box.
      const cs = getComputedStyle(parent);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      const maxW = parent.clientWidth - padL - padR;
      if (maxW <= 0) return;
      // Force lines to not wrap so scrollWidth reflects raw line length.
      el.style.whiteSpace = 'nowrap';
      // Wrap each <br>-separated line so we can measure individually.
      const lines = el.innerHTML.split(/<br\s*\/?>/i);
      el.innerHTML = lines.map(t => `<span class="pn-line" style="display:block;">${t}</span>`).join('');
      let size = 84;
      el.style.fontSize = size + 'px';
      const lineEls = el.querySelectorAll('.pn-line');
      // Iteratively reduce until every line fits.
      for (let i = 0; i < 30; i++) {
        let widest = 0;
        lineEls.forEach(l => { if (l.scrollWidth > widest) widest = l.scrollWidth; });
        if (widest <= maxW || size <= 28) break;
        size = Math.max(28, Math.floor(size * (maxW / widest) * 0.98));
        el.style.fontSize = size + 'px';
      }
    });
    // Shrink-to-fit position abbr (same approach as player name).
    wrap.querySelectorAll('.pos-abbr').forEach(el => {
      const parent = el.parentElement;
      if (!parent) return;
      const cs = getComputedStyle(parent);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      const maxW = parent.clientWidth - padL - padR;
      if (maxW <= 0) return;
      el.style.whiteSpace = 'nowrap';
      let size = 360;
      el.style.fontSize = size + 'px';
      for (let i = 0; i < 30; i++) {
        const w = el.scrollWidth;
        if (w <= maxW || size <= 80) break;
        size = Math.max(80, Math.floor(size * (maxW / w) * 0.98));
        el.style.fontSize = size + 'px';
      }
    });
  }
  document.querySelectorAll('#picker button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#picker button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.tpl = b.dataset.tpl;
      loadDefaults(state.tpl);
      renderForm();
      renderPreview();
    });
  });

  document.querySelectorAll('.chrome-row button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.chrome-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.chrome = b.dataset.chrome;
      renderPreview();
    });
  });

  document.querySelectorAll('#accent-row button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#accent-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.accent = b.dataset.acc;
      renderPreview();
    });
  });

  document.getElementById('photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const removeBg = document.getElementById('bg-remove-toggle').checked;
    const label = document.getElementById('upload-label');

    const setPhoto = (dataUrl, cutout) => {
      state.photo = dataUrl;
      state.photoCutout = cutout;
      document.getElementById('upload').classList.add('has-image');
      label.textContent = cutout ? '✓ Background removed' : '✓ Image loaded';
      renderPreview();
    };

    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      if (!removeBg) {
        setPhoto(dataUrl, false);
        return;
      }
      label.textContent = '… Loading model (first run ~70MB)';
      try {
        const { removeBackground } = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm');
        label.textContent = '… Removing background';
        const blob = await removeBackground(dataUrl, {
          progress: (key, cur, tot) => {
            const pct = tot ? Math.round((cur / tot) * 100) : 0;
            label.textContent = `… ${key} ${pct}%`;
          },
        });
        const reader2 = new FileReader();
        reader2.onload = (e2) => setPhoto(e2.target.result, true);
        reader2.readAsDataURL(blob);
      } catch (err) {
        console.error('bg removal failed', err);
        label.textContent = '✓ Image loaded (bg removal failed)';
        setPhoto(dataUrl, false);
      }
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    loadDefaults(state.tpl);
    state.photo = null;
    state.photoCutout = false;
    document.getElementById('upload').classList.remove('has-image');
    document.getElementById('upload-label').textContent = 'Drop or click to upload';
    document.getElementById('photo-input').value = '';
    document.getElementById('bg-remove-toggle').checked = false;
    renderForm();
    renderPreview();
  });

  async function loadHtmlToImage() {
    if (window.htmlToImage) return window.htmlToImage;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load html-to-image'));
      document.head.appendChild(s);
    });
    return window.htmlToImage;
  }

  async function fetchAsDataUrl(url, mime) {
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('Fetch failed: ' + url);
    const buf = await res.arrayBuffer();
    let bin = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    return `data:${mime};base64,` + btoa(bin);
  }

  let _embeddedFontCSS = null;
  async function buildEmbeddedFontCSS() {
    if (_embeddedFontCSS !== null) return _embeddedFontCSS;
    try {
      const [syne, outfit] = await Promise.all([
        fetchAsDataUrl(new URL('fonts/Syne-VariableFont_wght.ttf', location.href).href, 'font/ttf'),
        fetchAsDataUrl(new URL('fonts/Outfit-VariableFont_wght.ttf', location.href).href, 'font/ttf'),
      ]);
      _embeddedFontCSS = `
        @font-face { font-family: 'Syne'; src: url(${syne}) format('truetype-variations'); font-weight: 400 800; font-style: normal; }
        @font-face { font-family: 'Outfit'; src: url(${outfit}) format('truetype-variations'); font-weight: 100 900; font-style: normal; }
      `;
    } catch (e) {
      console.warn('Font embed failed', e);
      _embeddedFontCSS = '';
    }
    return _embeddedFontCSS;
  }

  async function saveOrShareImage(blob, filename) {
    const file = new File([blob], filename, { type: 'image/png' });
    // Prefer native share sheet on mobile (iOS/Android) so user can "Save to Photos".
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        // fall through to download fallback
        console.warn('Share failed, falling back to download', err);
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  document.getElementById('export-btn').addEventListener('click', async () => {
    const btn = document.getElementById('export-btn');
    const tile = document.querySelector('#preview-wrap .tile');
    if (!tile) { alert('Nothing to export yet.'); return; }
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Exporting…';
    const prevTransform = tile.style.transform;
    try {
      const htmlToImage = await loadHtmlToImage();
      // Render at full 1080×1080 (tile is scaled 0.5 for preview).
      tile.style.transform = 'none';
      // Make sure fonts are actually loaded before snapshotting.
      try {
        if (document.fonts) {
          await Promise.all([
            document.fonts.load('700 48px "Syne"'),
            document.fonts.load('800 72px "Syne"'),
            document.fonts.load('400 16px "Outfit"'),
            document.fonts.load('500 18px "Outfit"'),
            document.fonts.load('700 18px "Outfit"'),
          ]);
          await document.fonts.ready;
        }
      } catch (_) {}
      // Allow layout to flush.
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      // Pre-embed font CSS ourselves (html-to-image's own resolver chokes on the
      // relative truetype-variations URL in colors_and_type.css).
      const fontEmbedCSS = await buildEmbeddedFontCSS();
      const dataUrl = await htmlToImage.toPng(tile, {
        width: 1080,
        height: 1080,
        pixelRatio: 1,
        cacheBust: true,
        skipFonts: false,
        fontEmbedCSS,
      });
      const tplName = (state.tpl || 'post').replace(/[^a-z0-9-_]+/gi, '-').toLowerCase();
      const filename = `tff-${tplName}-1080.png`;
      const blob = await (await fetch(dataUrl)).blob();
      await saveOrShareImage(blob, filename);
    } catch (err) {
      console.error(err);
      alert('Export failed: ' + (err && err.message ? err.message : err));
    } finally {
      tile.style.transform = prevTransform;
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  function fitPreview() {
    const area = document.querySelector('.preview-area');
    const wrap = document.getElementById('preview-wrap');
    if (!area || !wrap) return;
    const cs = getComputedStyle(area);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const avail = Math.max(160, Math.min(
      area.clientWidth - padX,
      window.innerHeight - padY,
      540
    ));
    wrap.style.setProperty('--prev-size', avail + 'px');
  }
  window.addEventListener('resize', fitPreview);
  renderForm();
  fitPreview();
  renderPreview();
</script>
</body>
